<header class="mission-header" role="banner">
  <div class="brand-section">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9" />
        <path d="M3.6 9h16.8" />
        <path d="M3.6 15h16.8" />
        <path d="M11.5 3a17 17 0 0 0 0 18" />
        <path d="M12.5 3a17 17 0 0 1 0 18" />
      </svg>
    </div>
    <div class="brand-titles">
      <div class="brand-title">MARSWALK</div>
      <div class="brand-subtitle">Gale Crater EVA Planner</div>
    </div>
  </div>

  <div class="mission-meta">
    <div class="status-pill" [class]="'status-' + dataStatus()">
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-text">{{ statusLabel() }}</span>
    </div>

    @if (image(); as img) {
      <div class="dataset-tag" title="Active Raster Reference">
        <span class="tag-label">Raster:</span>
        <span class="tag-val">{{ img.imageRef }}</span>
      </div>
    } @else {
      <div class="dataset-tag tag-unloaded">
        <span class="tag-label">Raster:</span>
        <span class="tag-val">No raster loaded</span>
      </div>
    }
  </div>

  <div class="controls-section">
    <nav class="layer-toggles" aria-label="Map Layer Toggles">
      <button
        type="button"
        class="layer-btn"
        [class.active]="layers().imagery"
        (click)="toggleLayer('imagery')"
        aria-label="Toggle Imagery Layer"
        [attr.aria-pressed]="layers().imagery"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <path d="m21 15-5-5L5 21" />
        </svg>
        <span>Imagery</span>
      </button>

      <button
        type="button"
        class="layer-btn"
        [class.active]="layers().markers"
        (click)="toggleLayer('markers')"
        aria-label="Toggle Science Markers Layer"
        [attr.aria-pressed]="layers().markers"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        <span>Markers</span>
      </button>

      <button
        type="button"
        class="layer-btn"
        [class.active]="layers().grid"
        (click)="toggleLayer('grid')"
        aria-label="Toggle Coordinate Grid Layer"
        [attr.aria-pressed]="layers().grid"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M3 9h18M3 15h18M9 3v18M15 3v18" />
        </svg>
        <span>Grid</span>
      </button>
    </nav>

    <div class="actions">
      <!-- Theme Switcher Button -->
      <button
        type="button"
        class="theme-toggle-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (theme() === 'dark') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
      </button>

      <button
        type="button"
        class="action-btn export-btn"
        (click)="onExport()"
        aria-label="Export mission record JSON"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" x2="12" y1="15" y2="3" />
        </svg>
        <span>Export</span>
      </button>
    </div>
  </div>
</header>
